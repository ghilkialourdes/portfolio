<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Portfolio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0E0D1B;
      --bg-2: #161329;
      --ink: #EDEBFA;
      --muted: #9A96C2;
      --violet: #9B7CFB;
      --violet-deep: #B79BFF;
      --cyan: #3FE0F0;
      --pink: #F58FD1;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-soft: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --glass-shadow-hover: 0 16px 44px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ---- ambient blurred color field, the glassmorphism backdrop ---- */
    .blob-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.38;
      animation: drift 22s ease-in-out infinite;
    }

    .blob-a {
      width: 480px;
      height: 480px;
      background: var(--violet);
      top: -140px;
      left: -100px;
      animation-delay: 0s;
    }

    .blob-b {
      width: 420px;
      height: 420px;
      background: var(--cyan);
      top: 30%;
      right: -140px;
      animation-delay: -8s;
    }

    .blob-c {
      width: 380px;
      height: 380px;
      background: var(--pink);
      bottom: -120px;
      left: 20%;
      animation-delay: -14s;
    }

    @keyframes drift {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.08);
      }
    }

    #particles {
      display: none;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2.5rem;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      background: rgba(14, 13, 27, 0.55);
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--ink);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-logo img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18), 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 1.9rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--violet-deep);
    }

    section {
      position: relative;
      z-index: 1;
    }

    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      overflow: hidden;
    }

    .hero-bg-left,
    .hero-bg-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 36%;
      max-width: 750px;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      opacity: 0.85;
      filter: saturate(1.15) contrast(1.08) brightness(1.05);
      mask-composite: intersect;
      -webkit-mask-composite: source-in;
    }

    .hero-bg-left {
      left: 0;
      -webkit-mask-image:
        linear-gradient(to right, black 40%, transparent 90%),
        linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
      mask-image:
        linear-gradient(to right, black 40%, transparent 90%),
        linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    }

    .hero-bg-right {
      right: 0;
      -webkit-mask-image:
        linear-gradient(to left, black 40%, transparent 90%),
        linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
      mask-image:
        linear-gradient(to left, black 40%, transparent 90%),
        linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    }

    @media (max-width: 900px) {

      .hero-bg-left,
      .hero-bg-right {
        display: none;
      }
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .orbit-ring {
      display: none;
    }

    .hero-photo-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 0 auto 1.8rem;
      animation: fadeUp 0.9s 0.05s ease both;
    }

    .hero-photo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      border: 1px solid var(--glass-border);
    }

    .hero-photo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      background: var(--glass);
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .hero-tag {
      font-size: 0.8rem;
      color: var(--violet-deep);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.8s ease both;
    }

    .hero-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: 1.08;
      color: var(--ink);
      animation: fadeUp 0.9s 0.15s ease both;
      letter-spacing: -0.01em;
    }

    .hero-role {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 0.7rem;
      font-weight: 400;
      animation: fadeUp 0.9s 0.3s ease both;
    }

    .hero-role span {
      color: var(--violet-deep);
      font-weight: 600;
    }

    .hero-desc {
      max-width: 560px;
      margin: 1.5rem auto 0;
      font-size: 0.98rem;
      color: var(--muted);
      line-height: 1.8;
      animation: fadeUp 0.9s 0.45s ease both;
    }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.9s 0.6s ease both;
    }

    .btn-primary {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(108, 76, 224, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(108, 76, 224, 0.45);
    }

    .btn-outline {
      padding: 0.75rem 2rem;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: var(--ink);
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-3px);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .floating-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      max-width: 700px;
      margin: 3rem auto 0;
      animation: fadeUp 0.9s 0.75s ease both;
    }

    .pill {
      padding: 0.4rem 1.1rem;
      border-radius: 2rem;
      font-size: 0.78rem;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(8px);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.2s;
    }

    .pill:hover {
      border-color: var(--violet);
      color: var(--violet-deep);
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-4px);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-eyebrow {
      display: none;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 3.5vw, 2.3rem);
      font-weight: 600;
      color: var(--ink);
    }

    .section-line {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #about {
      padding: 6rem 0;
      position: relative;
      overflow: hidden;
    }

    #about::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(circle at 10% 40%, rgba(155, 124, 251, 0.22), transparent 42%),
        radial-gradient(circle at 90% 32%, rgba(245, 143, 209, 0.14), transparent 40%),
        radial-gradient(circle at 92% 68%, rgba(63, 224, 240, 0.2), transparent 42%),
        radial-gradient(circle at 8% 62%, rgba(155, 124, 251, 0.14), transparent 40%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 10rem, black calc(100% - 10rem), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, black 10rem, black calc(100% - 10rem), transparent 100%);
    }

    .about-grid {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .about-grid {
        grid-template-columns: 1fr;
      }
    }

    .about-sidebar {
      max-width: 380px;
    }

    .about-photo-card {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 0.6rem;
      margin-bottom: 1.2rem;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      transition: box-shadow 0.3s, transform 0.3s;
    }

    .about-photo-card:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-6px);
    }

    .about-photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
      object-fit: cover;
      object-position: top center;
    }

    .about-photo-card {
      aspect-ratio: 3/5.6;
    }

    .about-text p {
      font-size: 0.97rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.85;
      text-align: justify;
      text-justify: inter-word;
    }

    .about-text p strong {
      color: var(--ink);
      font-weight: 600;
    }

    .about-info {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      margin-top: 1.2rem;
    }

    .about-stat-box {
      border: 1.5px solid var(--cyan);
      background: rgba(63, 224, 240, 0.08);
      border-radius: 6px;
      padding: 0.9rem 0.8rem;
      text-align: center;
      box-shadow: 0 0 18px rgba(63, 224, 240, 0.18);
      transition: box-shadow 0.3s, transform 0.3s, background 0.3s;
    }

    .about-stat-box:hover {
      background: rgba(63, 224, 240, 0.14);
      box-shadow: 0 0 26px rgba(63, 224, 240, 0.3);
      transform: translateY(-4px);
    }

    .stat-num {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--violet-deep);
      line-height: 1.25;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--ink);
      margin-top: 0.15rem;
      line-height: 1.3;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
    }

    .info-icon {
      color: var(--violet-deep);
      width: 18px;
      flex-shrink: 0;
    }

    .info-label {
      color: var(--muted);
      min-width: 80px;
    }

    .info-val {
      color: var(--ink);
    }

    .info-val a {
      color: var(--violet-deep);
      text-decoration: none;
    }

    .info-val a:hover {
      color: var(--cyan);
    }

    #experience {
      padding: 6rem 0;
    }

    .hero-bg-photo2 {
      display: none;
    }

    .timeline {
      position: relative;
      padding-left: 2.5rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0.5rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, var(--violet), var(--cyan), transparent);
    }

    .tl-cert {
      margin-top: 0.7rem;
    }

    .tl-cert-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 0.7rem 0.35rem 0.35rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      text-decoration: none;
      color: var(--violet-deep);
      font-size: 0.78rem;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .tl-cert-link:hover {
      border-color: var(--violet);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-2px);
    }

    .tl-cert-thumb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .tl-item {
      position: relative;
      margin-bottom: 2.2rem;
    }

    .tl-dot {
      position: absolute;
      left: -2.1rem;
      top: 0.4rem;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--violet);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 108, 246, 0.2);
    }

    .tl-card {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 1.5rem 1.8rem;
      box-shadow: var(--glass-shadow);
      transition: box-shadow 0.3s, transform 0.3s;
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
    }

    .tl-card:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateX(6px);
    }

    .tl-logo {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--bg-1);
      margin-top: 0.15rem;
    }

    .tl-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .tl-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .tl-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .tl-company {
      font-weight: 600;
      color: var(--ink);
      font-size: 0.95rem;
    }

    .tl-role {
      font-size: 0.72rem;
      color: var(--violet-deep);
      background: rgba(139, 108, 246, 0.12);
      border: 1px solid rgba(139, 108, 246, 0.25);
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
    }

    .tl-date {
      font-size: 0.78rem;
      color: var(--muted);
      margin-left: auto;
    }

    .tl-desc {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .tl-desc li {
      margin-left: 1.2rem;
      margin-bottom: 0.2rem;
    }

    .current-badge {
      display: inline-block;
      font-size: 0.68rem;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      color: #0E0D1B;
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      font-weight: 600;
    }

    #projects {
      padding: 6rem 0;
    }

    .hero-bg-photo3 {
      display: none;
    }

    /* ---- Landscape project cards: full-width rows, left meta / right details ---- */
    .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .proj-card {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.8rem 2rem;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s, transform 0.3s;
      cursor: default;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 2rem;
    }

    .proj-card:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-6px);
    }

    .proj-meta {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--glass-border);
      padding-right: 2rem;
    }

    .proj-domain {
      font-size: 0.7rem;
      color: var(--violet);
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .proj-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--cyan);
      margin-bottom: 0.9rem;
    }

    .proj-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .proj-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .proj-desc {
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .proj-desc li {
      margin-left: 1.2rem;
      margin-bottom: 0.35rem;
      break-inside: avoid;
      text-align: justify;
      text-justify: inter-word;
    }

    .tech-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.65rem;
      border-radius: 0.5rem;
      background: rgba(139, 108, 246, 0.1);
      color: var(--pink);
      border: 1px solid rgba(139, 108, 246, 0.22);
    }

    @media (max-width: 800px) {
      .proj-card {
        flex-direction: column;
        gap: 1.2rem;
      }

      .proj-meta {
        flex: none;
        border-right: none;
        padding-right: 0;
        border-bottom: 1px solid var(--glass-border);
        padding-bottom: 1.2rem;
      }

      .proj-desc {
        column-width: auto;
        columns: 1;
      }
    }

    #skills {
      padding: 6rem 0;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    .skill-orb {
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.2rem 1rem;
      text-align: center;
      cursor: default;
      box-shadow: var(--glass-shadow);
      transition: box-shadow 0.25s, transform 0.25s, color 0.25s;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .skill-orb:hover {
      color: var(--violet-deep);
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-6px);
    }

    .skill-icon {
      width: 75%;
      object-fit: contain;
      display: block;
    }

    .skill-icon-fallback {
      width: 75%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(139, 108, 246, 0.12);
      border: 1px solid rgba(139, 108, 246, 0.3);
      color: var(--violet-deep);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      text-align: center;
      line-height: 1.1;
      padding: 0.2rem;
    }

    .skill-name {
      display: block;
      color: var(--muted);
    }

    #certifications {
      padding: 6rem 0;
    }

    .cert-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .cert-item {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      box-shadow: var(--glass-shadow);
      transition: box-shadow 0.3s, transform 0.3s, border-color 0.3s;
      text-decoration: none;
      color: inherit;
    }

    .cert-item.is-clickable {
      cursor: pointer;
    }

    .cert-item.is-clickable:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-4px);
      border-color: var(--violet);
    }

    .cert-item:not(.is-clickable):hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-4px);
    }

    .cert-item:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-4px);
    }

    .cert-view {
      margin-left: auto;
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(139, 108, 246, 0.1);
      border: 1px solid rgba(139, 108, 246, 0.25);
      color: var(--violet-deep);
      transition: background 0.25s, color 0.25s, transform 0.25s;
    }

    .cert-view svg {
      width: 15px;
      height: 15px;
    }

    .cert-item.is-clickable:hover .cert-view {
      background: var(--violet);
      color: #fff;
      transform: scale(1.1);
    }

    .cert-check {
      color: var(--violet-deep);
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .cert-thumb {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cert-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cert-text {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .cert-text strong {
      color: var(--ink);
      display: block;
      margin-bottom: 0.15rem;
    }

    #education {
      padding: 6rem 0;
    }

    .edu-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .edu-card {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s, transform 0.3s;
    }

    .edu-card:hover {
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-6px);
    }

    .edu-year {
      font-size: 0.75rem;
      color: var(--violet-deep);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .edu-degree {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .edu-stream {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .edu-school {
      font-size: 0.82rem;
      color: var(--violet-deep);
    }

    .edu-score {
      margin-top: 0.8rem;
    }

    .score-bar {
      height: 5px;
      background: rgba(139, 108, 246, 0.12);
      border-radius: 3px;
      margin-top: 0.4rem;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      border-radius: 3px;
      animation: fillBar 1.5s 0.5s ease both;
    }

    @keyframes fillBar {
      from {
        width: 0;
      }
    }

    .score-val {
      font-size: 0.75rem;
      color: var(--violet-deep);
      margin-top: 0.2rem;
    }

    #contact {
      padding: 6rem 0 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .contact-bg-left,
    .contact-bg-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      max-width: 500px;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: top center;
      opacity: 0.95;
      filter: saturate(1.15) contrast(1.08) brightness(1.05);
      mask-composite: intersect;
      -webkit-mask-composite: source-in;
    }

    .contact-bg-left {
      left: 0;
      -webkit-mask-image:
        linear-gradient(to right, black 25%, transparent 99%),
        linear-gradient(to top, black 0%, black 85%, transparent 100%),
        linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
      mask-image:
        linear-gradient(to right, black 25%, transparent 99%),
        linear-gradient(to top, black 0%, black 85%, transparent 100%),
        linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
    }

    .contact-bg-right {
      right: 0;
      -webkit-mask-image:
        linear-gradient(to left, black 25%, transparent 99%),
        linear-gradient(to top, black 0%, black 85%, transparent 100%),
        linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
      mask-image:
        linear-gradient(to left, black 25%, transparent 99%),
        linear-gradient(to top, black 0%, black 85%, transparent 100%),
        linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
    }

    #contact .container {
      position: relative;
      z-index: 1;
    }

    .contact-card {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 3rem 2rem;
      max-width: 680px;
      margin: 0 auto;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .contact-card p {
      color: var(--muted);
      font-size: 0.97rem;
      max-width: 460px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }

    .contact-links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color .2s, color .2s, box-shadow .2s, transform .2s, background .2s;
    }

    .contact-link:hover {
      border-color: var(--violet);
      color: var(--violet-deep);
      background: rgba(255, 255, 255, 0.13);
      box-shadow: var(--glass-shadow-hover);
      transform: translateY(-4px);
    }

    .contact-link svg,
    .contact-link .info-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: var(--violet-deep);
    }

    @media (max-width: 900px) {

      .contact-bg-left,
      .contact-bg-right {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .contact-links {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      #contact {
        padding: 4rem 0 3rem;
      }

      .contact-card {
        padding: 2rem 1.1rem;
        border-radius: 22px;
      }

      .contact-card p {
        font-size: 0.92rem;
        margin-bottom: 1.5rem;
      }

      .contact-links {
        gap: 0.7rem;
      }

      .contact-link {
        padding: 0.75rem 0.6rem;
        font-size: 0.8rem;
      }
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.78rem;
      color: rgba(154, 150, 194, 0.7);
      border-top: 1px solid var(--glass-border);
      position: relative;
      z-index: 1;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--violet);
      border-radius: 3px;
    }

    @media (max-width: 768px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    /* ================= Responsive navigation (hamburger) ================= */

    /* Hamburger button (hidden on desktop) */
    .nav-toggle {
      display: none;
      width: 42px;
      height: 42px;
      padding: 0;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .nav-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }

    .nav-toggle.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .nav-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Keep section headings from hiding under the fixed nav */
    section[id] {
      scroll-margin-top: 70px;
    }

    @media (max-width: 768px) {
      nav {
        padding: 0.7rem 1.1rem;
      }

      .nav-logo {
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .nav-logo img {
        width: 36px;
        height: 36px;
      }

      .nav-toggle {
        display: flex;
      }

      /* Dropdown panel */
      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        padding: 0 1.1rem;
        background: #0E0D1B;
        border-bottom: 1px solid var(--glass-border);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: max-height .35s ease, opacity .25s ease, padding .35s ease;
      }

      .nav-links.open {
        max-height: calc(100vh - 64px);
        overflow-y: auto;
        opacity: 1;
        pointer-events: auto;
        padding: 0.5rem 1.1rem 1rem;
      }

      .nav-links li {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .nav-links li:last-child {
        border-bottom: none;
      }

      .nav-links a {
        display: block;
        padding: 0.85rem 0.2rem;
        font-size: 0.95rem;
      }
    }

    /* ================= Resume download ================= */
    .btn-primary,
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .nav-links a.nav-resume {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      border: 1px solid var(--violet);
      background: rgba(155, 124, 251, 0.15);
      color: var(--ink);
      transition: background 0.2s, transform 0.2s, color 0.2s;
    }

    .nav-links a.nav-resume:hover {
      background: var(--violet);
      color: #fff;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .nav-links li:has(.nav-resume) {
        padding: 0.7rem 0 0.2rem;
      }

      .nav-links a.nav-resume {
        display: flex;
        justify-content: center;
        padding: 0.7rem 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      </div>
      <div class="edu-cards" id="edu-cards"></div>

  </section>

  <section id="contact">
    <div class="contact-bg-left" id="contact-bg-left"></div>
    <div class="contact-bg-right" id="contact-bg-right"></div>
    <div class="container">
      <div class="section-header reveal">
        <h2 class="section-title">Let's Connect</h2>
        <div class="section-line"></div>

      <div class="contact-card reveal">
        <p id="contact-blurb"></p>
        <div class="contact-links" id="contact-links"></div>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>

  <script>
    const ICONS = {

    function el(html) {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    }

    async function loadData() {
      const res = await fetch('data.json');
      if (!res.ok) throw new Error('Failed to load data.json');
      return res.json();
    }

    function renderNav(data) {
      document.title = data.site.title;
      document.getElementById('page-title').textContent = data.site.title;
      const logo = document.getElementById('nav-logo');
      logo.innerHTML = `<img src="${data.nav.logoImage}" alt="${data.nav.logoName}" />${data.nav.logoName}`;
      const links = document.getElementById('nav-links');
      const resumeLi = data.nav.resume
        ? `<li><a class="nav-resume" href="${data.nav.resume}" download>${ICONS.download}Resume</a></li>`
        : '';
      links.innerHTML = data.nav.links.map(l => `<li><a href="${l.href}">${l.label}</a></li>`).join('') + resumeLi;
      document.getElementById('footer').innerHTML = `<p>${data.site.footer}</p>`;
    }

    function renderHero(data) {
      const h = data.hero;
      document.getElementById('hero-photo').innerHTML = `<img src="${h.photo}" alt="${h.name}" />`;
      document.getElementById('hero-name').textContent = h.name;
      document.getElementById('hero-role').innerHTML = `<span>${h.roleLine.highlight}</span>${h.roleLine.rest}`;
      document.getElementById('hero-desc').textContent = h.description;
      document.getElementById('hero-ctas').innerHTML = h.ctas.map(c =>
        `<a href="${c.href}" class="btn-${c.style}"${c.download ? ' download' : ''}>${c.download ? ICONS.download : ''}${c.label}</a>`
      ).join('');
      document.getElementById('hero-pills').innerHTML = h.pills.map(p =>
        `<span class="pill">${p.text}</span>`
      ).join('');

      const leftImg = h.bgPhotoLeft || h.bgPhoto;
      const rightImg = h.bgPhotoRight || h.bgPhoto;
      if (leftImg) document.getElementById('hero-bg-left').style.backgroundImage = `url("${leftImg}")`;
      if (rightImg) document.getElementById('hero-bg-right').style.backgroundImage = `url("${rightImg}")`;
    }

    function renderAbout(data) {
      const a = data.about;
      document.getElementById('about-photo').innerHTML = `<img src="${a.photo}" alt="${a.photoAlt}" />`;
      document.getElementById('about-paragraphs').innerHTML = a.paragraphs.map(p => `<p>${p}</p>`).join('');
      document.getElementById('about-stats').innerHTML = a.stats.map(s =>
        `<div class="about-stat-box">
          <div class="stat-num">${s.num}</div>
          <div class="stat-label">${s.label}</div>
        </div>`
      ).join('');
      document.getElementById('about-info').innerHTML = a.info.map(i => {
        const val = i.href ? `<a href="${i.href}" ${i.href.startsWith('http') ? 'target="_blank"' : ''}>${i.value}</a>` : i.value;
        return `<div class="info-row">${ICONS[i.icon]}<span class="info-label">${i.label}</span><span class="info-val">${val}</span></div>`;
      }).join('');
    }

    function renderExperience(data) {
      const e = data.experience;
      document.getElementById('experience-timeline').innerHTML = e.items.map((item, idx) => `
        <div class="tl-item reveal" style="transition-delay:${(idx * 0.1).toFixed(1)}s">
          <div class="tl-dot"></div>
          <div class="tl-card">
            <div class="tl-logo">${item.logo ? `<img src="${item.logo}" alt="${item.company} logo" />` : (item.company || '').trim().charAt(0)}</div>
            <div class="tl-body">
              <div class="tl-meta">
                <span class="tl-company">${item.company}</span>
                <span class="tl-role">${item.role}</span>
                ${item.current ? '<span class="current-badge">Current</span>' : ''}
                <span class="tl-date">${item.date}</span>
              </div>
              <ul class="tl-desc">${item.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
              ${item.certificate ? `
              <div class="tl-cert">
                <a href="${item.certificate}" class="tl-cert-link" target="_blank" rel="noopener noreferrer">
                  <img class="tl-cert-thumb" src="${item.certificate}" alt="${item.company} experience certificate" />
                  View Experience Certificate
                </a>
              </div>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderProjects(data) {
      const p = data.projects;
      document.getElementById('projects-grid').innerHTML = p.items.map((proj, idx) => `
        <div class="proj-card reveal" style="transition-delay:${(idx * 0.08).toFixed(2)}s">
          <div class="proj-meta">
            <div class="proj-domain">${proj.domain}</div>
            <div class="proj-title">${proj.title}</div>
            <div class="proj-tech">${proj.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}</div>
          </div>
          <div class="proj-body">
            <ul class="proj-desc">${proj.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
          </div>
        </div>
      `).join('');
    }

    function renderSkills(data) {
      const s = data.skills;
      document.getElementById('skills-grid').innerHTML = s.items.map(item => {
        const iconHtml = item.icon
          ? `<img src="${item.icon}" alt="${item.name}" class="skill-icon" />`
          : `<span class="skill-icon-fallback">${(item.name || '?')}</span>`;
        return `<div class="skill-orb">${iconHtml}</div>`;
      }).join('');
    }

    function renderCertifications(data) {
      const c = data.certifications;
      document.getElementById('cert-list').innerHTML = c.items.map(item => {
        const thumb = item.image
          ? `<div class="cert-thumb"><img src="${item.image}" alt="${item.title} certificate" /></div>`
          : (item.logo
            ? `<div class="cert-thumb"><img src="${item.logo}" alt="${item.issuer} logo" /></div>`
            : `<span class="cert-check">✦</span>`);

        const eyeIcon = item.certificate
          ? `<span class="cert-view" title="View certificate">${ICONS.eye}</span>`
          : '';

        const inner = `${thumb}<div class="cert-text"><strong>${item.title}</strong>${item.issuer}</div>${eyeIcon}`;

        return item.certificate
          ? `<a class="cert-item is-clickable" href="${item.certificate}" target="_blank" rel="noopener noreferrer">${inner}</a>`
          : `<div class="cert-item">${inner}</div>`;
      }).join('');
    }

    function renderEducation(data) {
      document.getElementById('edu-cards').innerHTML = data.education.items.map((item, idx) => `
        <div class="edu-card reveal" style="transition-delay:${(idx * 0.1).toFixed(1)}s">
          <div class="edu-year">${item.year}</div>
          <div class="edu-degree">${item.degree}</div>
          <div class="edu-stream">${item.stream}</div>
          <div class="edu-school">${item.school}</div>
          <div class="edu-score">
            <div class="score-val">${item.scoreLabel}</div>
            <div class="score-bar"><div class="score-fill" style="width:${item.scorePercent}%"></div></div>
          </div>
        </div>
      `).join('');
    }

    function renderContact(data) {
      const c = data.contact;
      const leftImg = c.bgPhotoLeft || c.bgPhoto;
      const rightImg = c.bgPhotoRight || c.bgPhoto;
      if (leftImg) document.getElementById('contact-bg-left').style.backgroundImage = `url("${leftImg}")`;
      if (rightImg) document.getElementById('contact-bg-right').style.backgroundImage = `url("${rightImg}")`;
      document.getElementById('contact-blurb').textContent = c.blurb;
      document.getElementById('contact-links').innerHTML = c.links.map(l =>
        `<a href="${l.href}" class="contact-link" target="_blank" rel="noopener noreferrer">${ICONS[l.icon]}${l.label}</a>`
      ).join('');
    }

    function initRevealAndNav() {
      /* ---------- Hamburger menu ---------- */
      const toggle = document.getElementById('nav-toggle');
      const navList = document.getElementById('nav-links');

      const closeMenu = () => {
        navList.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      };

      toggle.addEventListener('click', () => {
        const isOpen = navList.classList.toggle('open');
        toggle.classList.toggle('open', isOpen);
        toggle.setAttribute('aria-expanded', isOpen);
      });

      // close after tapping a link
      navList.addEventListener('click', e => {
        if (e.target.closest('a')) closeMenu();
      });

      // close when tapping outside the nav
      document.addEventListener('click', e => {
        if (!e.target.closest('nav')) closeMenu();
      });

      // reset if the window is resized back to desktop
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeMenu();
      });

      /* ---------- Scroll reveal ---------- */
      const reveals = document.querySelectorAll('.reveal');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
      }, { threshold: 0.1 });
      reveals.forEach(el => obs.observe(el));

      /* ---------- Active nav link highlight ---------- */
      const sections = document.querySelectorAll('section[id]');
      const navLinks = document.querySelectorAll('.nav-links a');
      window.addEventListener('scroll', () => {
        let cur = '';
        sections.forEach(s => { if (window.scrollY >= s.offsetTop - 120) cur = s.id; });
        navLinks.forEach(a => {
          a.style.color = a.getAttribute('href') === '#' + cur ? 'var(--violet-deep)' : '';
        });
      });
    }

    async function init() {
      try {
        const data = await loadData();
        renderNav(data);
        renderHero(data);
        renderAbout(data);
        renderExperience(data);
        renderProjects(data);
        renderSkills(data);
        renderCertifications(data);
        renderEducation(data);
        renderContact(data);
      } catch (err) {
        document.body.innerHTML = `<div style="padding:3rem;color:#EDEBFA;font-family:sans-serif;background:#0E0D1B;min-height:100vh">
          <h2>Couldn't load data.json</h2>
          <p style="color:#9A96C2">${err.message}. If you opened this file directly (file://), browsers block fetch() for local JSON. Serve the folder with a local server, e.g. <code>python3 -m http.server</code>, then open http://localhost:8000.</p>
        </div>`;
        return;
      }
      initRevealAndNav();
    }

    init();
  </script>
</body>

</html>
